<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art Lab, Gauravi Linjara</title>
<meta name="description" content="The Lab: a set of small interactive experiments by Gauravi Linjara. Famous paintings, each hiding a small idea you can move to find, plus a few live experiments." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f2;--ink:#16202b;--ink-2:#4E5F74;--muted:#8b95a3;--line:#e7e7e3;--blue:#0083E7;--blue-tint:#eaf4fe;
    --sans:"Satoshi",system-ui,sans-serif;--serif:"Satoshi","Satoshi",system-ui,sans-serif;--mono:"Satoshi",monospace;
    --font-display:"Satoshi",system-ui,sans-serif;--font-mono:"Satoshi",monospace;--soft:#454f59;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;
    background:radial-gradient(80% 60% at 50% -8%,#ffffff,transparent 60%),var(--bg);background-attachment:fixed}
  @media(pointer:fine){body{cursor:none}}
  .col{max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}

  /* header */
  .head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin:clamp(40px,9vh,96px) 0 clamp(26px,4vh,44px)}
  .kick{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:lowercase;color:var(--blue);display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .kick::before{content:"";width:30px;height:1px;background:var(--blue)}
  .head h1{font-family:var(--sans);font-weight:400;font-size:clamp(36px,6.2vw,82px);letter-spacing:-.03em;line-height:.94}
  .head h1 em{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--blue);letter-spacing:-.02em}
  .head p{font-family:var(--sans);font-weight:400;font-size:clamp(14px,1.3vw,16px);color:var(--ink-2);margin-top:16px;max-width:44ch;line-height:1.5}
  .head p em{font-style:normal;color:var(--blue)}
  .toggle{display:flex;gap:3px;background:rgba(255,255,255,.6);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:11px;padding:3px;flex:0 0 auto}
  .toggle button{width:38px;height:34px;display:grid;place-items:center;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--muted);transition:.2s}
  .toggle button svg{width:17px;height:17px;display:block}
  .toggle button.on{background:var(--blue-tint);color:var(--blue)}

  /* ── masonry gallery ── */
  .cards.grid{column-count:3;column-gap:clamp(16px,1.6vw,22px);padding-bottom:clamp(56px,10vh,110px)}
  @media(max-width:920px){.cards.grid{column-count:2}}
  @media(max-width:560px){.cards.grid{column-count:1}}

  .card{display:block;width:100%;break-inside:avoid;margin:0 0 clamp(16px,1.6vw,22px);
    border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;
    perspective:1200px;opacity:0;transform:translateY(60px);
    transition:opacity .8s var(--ease),transform .9s var(--ease)}
  .card.in{opacity:1;transform:none}

  .frame{position:relative;display:block;border-radius:18px;overflow:hidden;aspect-ratio:var(--ar,4/5);
    background:#0e1319;transform-style:preserve-3d;will-change:transform;
    box-shadow:0 18px 40px -24px rgba(22,32,43,.4);
    transition:transform .5s var(--ease),box-shadow .5s ease}
  .card:hover .frame{box-shadow:0 44px 80px -30px var(--sh,rgba(22,32,43,.5)),0 12px 30px -18px rgba(22,32,43,.3)}
  .card:focus-visible{outline:none}
  .card:focus-visible .frame{box-shadow:0 0 0 3px var(--pc,#0083E7),0 30px 60px -28px rgba(22,32,43,.4)}

  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
    clip-path:inset(0 0 102% 0);transform:scale(1.06);filter:saturate(.92);
    transition:clip-path 1.05s var(--ease) .05s,transform .9s var(--ease),filter .5s ease}
  .card.in .frame img{clip-path:inset(0 0 0 0);transform:scale(1)}
  .card:hover .frame img{transform:scale(1.08);filter:saturate(1.05)}

  /* short scrim — only darkens the bottom strip under the title, so bright covers keep their true colour */
  .scrim{position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(to top,rgba(8,11,15,.82) 0%,rgba(8,11,15,.22) 24%,transparent 42%);
    opacity:.92;transition:opacity .45s ease}
  .card:hover .scrim{opacity:1}
  .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:0;
    background:radial-gradient(240px 240px at var(--mx,50%) var(--my,50%),rgba(255,255,255,.55),transparent 60%);transition:opacity .4s ease}
  .card:hover .sheen{opacity:1}

  .num{position:absolute;top:14px;left:16px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:rgba(255,255,255,.82);
    transform:translateZ(40px);text-shadow:0 1px 12px rgba(0,0,0,.5)}
  .live{position:absolute;top:13px;right:14px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
    color:#fff;background:var(--pc,var(--blue));padding:4px 9px;border-radius:999px;transform:translateZ(40px);box-shadow:0 2px 12px rgba(0,0,0,.3)}

  .cap{position:absolute;left:18px;right:18px;bottom:16px;transform:translateZ(48px);z-index:2}
  .idea{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:lowercase;color:rgba(255,255,255,.9);
    opacity:0;transform:translateY(10px);transition:opacity .45s ease,transform .5s var(--ease);text-shadow:0 1px 10px rgba(0,0,0,.6)}
  .card:hover .idea{opacity:1;transform:none}
  .name{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:500;font-size:clamp(20px,1.7vw,26px);
    letter-spacing:-.01em;line-height:1.1;color:#fff;margin-top:7px;text-shadow:0 2px 16px rgba(0,0,0,.5)}
  .name .ar{font-family:var(--sans);font-size:.72em;opacity:0;transform:translate(-6px,4px);transition:opacity .4s ease,transform .45s var(--ease)}
  .card:hover .name .ar{opacity:1;transform:none}

  /* list mode */
  .cards.list{column-count:1;display:flex;flex-direction:column;gap:10px;padding-bottom:clamp(56px,10vh,110px)}
  .cards.list .card{margin:0;opacity:1;transform:none;perspective:none}
  .cards.list .frame{display:flex;align-items:center;gap:20px;aspect-ratio:auto;background:rgba(255,255,255,.6);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);padding:14px 20px 14px 14px;box-shadow:none}
  .cards.list .card:hover .frame{box-shadow:0 20px 44px -26px var(--sh,rgba(22,32,43,.4))}
  .cards.list .frame img{position:relative;width:84px;height:84px;flex:0 0 auto;border-radius:12px;clip-path:none;transform:none;filter:none}
  .cards.list .scrim,.cards.list .sheen,.cards.list .num,.cards.list .live{display:none}
  .cards.list .cap{position:static;transform:none;flex:1;min-width:0}
  .cards.list .idea{opacity:1;transform:none;color:var(--ink-2);text-shadow:none;margin-top:5px;order:2}
  .cards.list .name{color:var(--ink);text-shadow:none;margin:0;font-size:clamp(19px,2vw,24px)}
  .cards.list .name .ar{opacity:1;transform:none;color:var(--blue)}

  /* footer dock */
  .foot{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;width:min(1160px,calc(100vw - 36px));
    display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:13px 22px;border-radius:20px;
    background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);
    border:1px solid rgba(255,255,255,.8);box-shadow:0 16px 40px -16px rgba(22,32,43,.4),inset 0 1px 0 rgba(255,255,255,.85)}
  .fsocial{display:flex;gap:8px}.fsocial a{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink-2);transition:.2s}
  .fsocial a:hover{color:var(--blue);background:var(--blue-tint)}.fsocial svg{width:18px;height:18px}
  .flinks{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:lowercase;color:var(--muted)}
  .flinks a{color:var(--ink);text-decoration:none;transition:color .2s}.flinks a:hover{color:var(--blue)}

  /* custom cursor */
  .cur{position:fixed;top:0;left:0;z-index:200;pointer-events:none;width:12px;height:12px;border-radius:50%;
    background:var(--ink);mix-blend-mode:difference;transform:translate(-50%,-50%);
    transition:width .3s var(--ease),height .3s var(--ease),background .3s ease;display:grid;place-items:center}
  .cur .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:lowercase;color:#fff;opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s var(--ease);white-space:nowrap}
  body.cur-open .cur{width:66px;height:66px;background:var(--blue);mix-blend-mode:normal}
  body.cur-open .cur .lbl{opacity:1;transform:none}
  @media(pointer:coarse){.cur{display:none}}

  /* minimal modal */
  #m{position:fixed;inset:0;z-index:120;background:rgba(244,244,242,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    opacity:0;visibility:hidden;transition:opacity .34s,visibility .34s;display:grid;grid-template-rows:auto 1fr;padding:16px clamp(14px,4vw,40px) clamp(14px,4vw,40px)}
  #m.open{opacity:1;visibility:visible}
  .mtop{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 2px 16px}
  .mtitle{display:flex;align-items:baseline;gap:12px;min-width:0}
  .mtitle .mc{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
  .mtitle .mn{font-family:var(--serif);font-size:19px;letter-spacing:-.01em}.mtitle .mn em{font-style:italic;color:var(--blue)}
  .mctrl{display:flex;gap:8px;flex:0 0 auto}
  .mbtn{width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:15px;cursor:pointer;transition:.2s}
  .mbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
  .mstage{position:relative;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 40px 90px -50px rgba(22,32,43,.5)}
  .mstage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
  @media(prefers-reduced-motion:reduce){
    .card{opacity:1;transform:none;transition:none}.frame img{clip-path:none;transform:none}.cur{display:none}body{cursor:auto}
  }
</style>

<meta property="og:title" content="Art Lab, Gauravi Linjara" />
<meta property="og:description" content="Famous paintings, each hiding a small idea you can move to find, plus a few live experiments." />

<meta name="twitter:title" content="Art Lab, Gauravi Linjara" />
<meta name="twitter:description" content="Famous paintings, each hiding a small idea you can move to find, plus a few live experiments." />

<body>
<div class="pgx" id="pgx" aria-hidden="true">
  <div class="pgx-ink"></div>
  <div class="pgx-mark"><span class="wm">gauravi<span class="dot">.</span></span></div>
  <svg width="0" height="0" aria-hidden="true"><filter id="pgxink"><feTurbulence type="fractalNoise" baseFrequency="0.013 0.021" numOctaves="2" seed="6" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
  </div>
  <div class="cur" id="cur"><span class="lbl">open</span></div>
  <main>
  <div class="col">
    <div class="head">
      <div>
        <h1>twelve<br>playable <em>ideas</em>.</h1>
        <p>Famous paintings, each hiding a small idea you can <em>move to find</em>, plus a few live experiments.</p>
      </div>
      <div class="toggle" role="tablist" aria-label="view">
        <button id="tGrid" class="on" aria-label="grid view" title="grid">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="2"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="2"/><rect x="13" y="13" width="7.5" height="7.5" rx="2"/></svg>
        </button>
        <button id="tList" aria-label="list view" title="list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
      </div>
    </div>

    <div class="cards grid" id="cards"></div>
  </div>
  </main>

  <div id="m" role="dialog" aria-modal="true" aria-label="experiment viewer">
    <div class="mtop">
      <div class="mtitle"><span class="mc" id="mCount"></span><span class="mn" id="mName"></span></div>
      <div class="mctrl"><button class="mbtn" id="mPrev" aria-label="previous">←</button><button class="mbtn" id="mNext" aria-label="next">→</button><button class="mbtn" id="mX" aria-label="close">✕</button></div>
    </div>
    <div class="mstage"><iframe id="mFrame" title="experiment" allow="microphone; camera"></iframe></div>
  </div>

<script>
  const F='https://commons.wikimedia.org/wiki/Special:FilePath/';
  const DOORS=[
    ['I','sfumato','the blur is where life lives','#C8643C','/mockups/lab-sfumato.html',F+'Mona_Lisa,_by_Leonardo_da_Vinci,_from_C2RMF_retouched.jpg?width=520','4/5','',0],
    ['II','the angel in the marble','you become yourself by subtraction','#E8B53C','/mockups/lab-marble.html',F+'%27David%27_by_Michelangelo_JBU0001.JPG?width=460','3/4','',0],
    ['III','chiaroscuro','no light without the dark','#E0542E','/mockups/lab-chiaroscuro.html',F+'1665_Girl_with_a_Pearl_Earring.jpg?width=520','4/5','',0],
    ['IV','dharma','do the work, then let go','#C3A9DE','/mockups/lab-dharma.html',F+'The_Fighting_Temeraire,_JMW_Turner,_National_Gallery.jpg?width=560','5/4','',0],
    ['V','the vanishing point','where you stand decides everything','#9FC0D6','/mockups/lab-vanishing.html',F+'%22The_School_of_Athens%22_by_Raffaello_Sanzio_da_Urbino.jpg?width=600','16/10','',0],
    ['VI','pentimento','we are made of our revisions','#E89AA6','/mockups/lab-pentimento.html',F+'Sandro_Botticelli_-_La_nascita_di_Venere_-_Google_Art_Project_-_edited.jpg?width=600','5/4','',0],
    ['VII','the butterfly effect','a small nudge, a far-off storm','#7FB0D6','/mockups/lab-butterfly.html',F+'John_Constable_-_Wivenhoe_Park,_Essex_-_Google_Art_Project.jpg?width=560','4/5','',0],
    ['VIII','the domino effect','some falls cannot be undone','#A6B83C','/mockups/lab-domino.html',F+'Pieter_Bruegel_the_Elder_-_Landscape_with_the_Fall_of_Icarus_-_WGA03322.jpg?width=600','16/10','',0],
    ['IX','compounding','a day is small. a decade is not','#D99A2B','/mockups/lab-compounding.html',F+'The_Kiss_-_Gustav_Klimt_-_Google_Cultural_Institute.jpg?width=500','3/4','',0],
    ['X','entropy','order is something you keep choosing','#9B8AA8','/mockups/lab-entropy.html',F+'Primavera_di_Stabiae.jpg?width=520','4/5','',0],
    ['XI','emergence','the flock has no leader','#8FBD6C','/mockups/lab-emergence.html',F+'Vincent_van_Gogh_-_Wheatfield_with_crows_-_Google_Art_Project.jpg?width=600','16/9','',0],
    ['XII','the line','flow is surrender, not force','#5FB4A6','/mockups/lab-line.html',F+'Claude_Monet_-_Water_Lilies_-_1906,_Ryerson.jpg?width=560','5/4','',0],
    ['XIII','the fogged glass','we write what we know will fade','#0083E7','/mockups/lab-fogmirror.html','/mockups/assets/fogmirror-poster.jpg','16/9','',1],
    ['XIV','say my name','four letters that defeat everyone','#3A97E8','/mockups/lab-sayit.html','/mockups/assets/sayit-poster.svg','16/10','',1],
    ['XV','the excuse machine','yawn your way out of anything','#E6B30C','/mockups/lab-excuse.html','/mockups/assets/excuse-poster.webp','16/9','',1]
  ];
  function rgba(hex,a){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `rgba(${r},${g},${b},${a})`;}
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches, fine=matchMedia('(pointer:fine)').matches;
  const wrap=document.getElementById('cards');
  DOORS.forEach((d,i)=>{
    const c=document.createElement('button');
    c.className='card'; c.type='button'; c.setAttribute('aria-label',d[1]+' — open experiment');
    c.style.setProperty('--ar',d[6]); c.style.setProperty('--pc',d[3]); c.style.setProperty('--sh',rgba(d[3],.55));
    c.innerHTML=`<span class="frame">
        <img referrerpolicy="no-referrer" src="${d[5]}" alt="${d[1]}">
        <span class="scrim"></span><span class="sheen"></span>
        <span class="num">${d[0]}</span>${d[8]?'<span class="live">live</span>':''}
        <span class="cap"><span class="idea">${d[2]}</span><span class="name">${d[1]} <span class="ar">↗</span></span></span>
      </span>`;
    c.addEventListener('click',()=>openModal(i));
    wrap.appendChild(c);
  });
  const cards=[...wrap.children];

  /* staggered reveal */
  if(reduce){cards.forEach(c=>c.classList.add('in'));}
  else{
    const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const i=cards.indexOf(e.target);setTimeout(()=>e.target.classList.add('in'),(i%3)*80);io.unobserve(e.target);}}),{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    cards.forEach(c=>io.observe(c));
    setTimeout(()=>cards.forEach(c=>c.classList.add('in')),2800);
  }

  /* tilt + sheen */
  if(fine&&!reduce){
    cards.forEach(c=>{
      const fr=c.querySelector('.frame');
      c.addEventListener('pointermove',e=>{if(wrap.classList.contains('list'))return;
        const r=c.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
        fr.style.transform=`translateY(-6px) rotateX(${(py-.5)*-8}deg) rotateY(${(px-.5)*9}deg)`;
        fr.style.setProperty('--mx',px*100+'%');fr.style.setProperty('--my',py*100+'%');});
      c.addEventListener('pointerleave',()=>{fr.style.transform='';});
    });
  }

  /* custom cursor */
  if(fine&&!reduce){
    const cur=document.getElementById('cur');let cx=innerWidth/2,cy=innerHeight/2,tx=cx,ty=cy;
    addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;},{passive:true});
    (function loop(){cx+=(tx-cx)*.2;cy+=(ty-cy)*.2;cur.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;requestAnimationFrame(loop);})();
    cards.forEach(c=>{c.addEventListener('pointerenter',()=>document.body.classList.add('cur-open'));
      c.addEventListener('pointerleave',()=>document.body.classList.remove('cur-open'));});
  }

  /* toggle */
  const tGrid=document.getElementById('tGrid'),tList=document.getElementById('tList');
  tGrid.addEventListener('click',()=>{wrap.className='cards grid';tGrid.classList.add('on');tList.classList.remove('on');});
  tList.addEventListener('click',()=>{wrap.className='cards list';tList.classList.add('on');tGrid.classList.remove('on');});

  /* modal */
  const m=document.getElementById('m'),mFrame=document.getElementById('mFrame'),mCount=document.getElementById('mCount'),mName=document.getElementById('mName');
  let ci=0,isOpen=false;
  function load(i){ci=i;const d=DOORS[i];mCount.textContent=String(i+1).padStart(2,'0')+' / '+DOORS.length;mName.innerHTML=d[0]+' · <em>'+d[1]+'</em>';mFrame.src=d[4];}
  function openModal(i){isOpen=true;load(i);m.classList.add('open');document.body.style.overflow='hidden';}
  function closeModal(){isOpen=false;m.classList.remove('open');document.body.style.overflow='';mFrame.src='about:blank';}
  function step(dir){if(!isOpen)return;load((ci+dir+DOORS.length)%DOORS.length);}
  document.getElementById('mX').addEventListener('click',closeModal);
  document.getElementById('mPrev').addEventListener('click',()=>step(-1));
  document.getElementById('mNext').addEventListener('click',()=>step(1));
  addEventListener('keydown',e=>{if(!isOpen)return;if(e.key==='Escape')closeModal();else if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1);});
</script>
